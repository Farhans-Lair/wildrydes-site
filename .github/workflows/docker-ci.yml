name: Docker CI/CD - Build, Push to ECR & Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::680318115068:role/GitHubActions-ECR-Push-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t wildrydes-site .

      - name: Tag Docker image
        run: |
          docker tag wildrydes-site:latest \
          680318115068.dkr.ecr.ap-south-1.amazonaws.com/wildrydes-site:latest

      - name: Push Docker image to ECR
        run: |
          docker push \
          680318115068.dkr.ecr.ap-south-1.amazonaws.com/wildrydes-site:latest

      # ✅ ADD ECS CLUSTER STEP
      - name: Create ECS cluster if not exists
        run: |
          aws ecs describe-clusters \
            --clusters wildrydes-cluster \
            --region ap-south-1 \
            --query "clusters[?status=='ACTIVE'] | length(@)" \
            --output text | grep -q 1 || \
          aws ecs create-cluster \
            --cluster-name wildrydes-cluster \
            --region ap-south-1

      # ✅ REGISTER TASK DEFINITION
      - name: Register ECS Task Definition
        run: |
          cat <<EOF > task-def.json
          {
            "family": "wildrydes-task",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "256",
            "memory": "512",
            "executionRoleArn": "arn:aws:iam::680318115068:role/ecsTaskExecutionRole",
            "containerDefinitions": [
              {
                "name": "wildrydes-container",
                "image": "680318115068.dkr.ecr.ap-south-1.amazonaws.com/wildrydes-site:latest",
                "essential": true,
                "portMappings": [
                  {
                    "containerPort": 80,
                    "protocol": "tcp"
                  }
                ]
              }
            ]
          }
          EOF

          aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --region ap-south-1

      # ✅ CREATE ECS SERVICE
      - name: Create ECS Service if not exists
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster wildrydes-cluster \
            --services wildrydes-service \
            --region ap-south-1 \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_STATUS" = "MISSING" ] || [ "$SERVICE_STATUS" = "INACTIVE" ] || [ "$SERVICE_STATUS" = "None" ]; then
            aws ecs create-service \
              --cluster wildrydes-cluster \
              --service-name wildrydes-service \
              --task-definition wildrydes-task \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-xxxx,subnet-yyyy],securityGroups=[sg-xxxx],assignPublicIp=ENABLED}" \
              --region ap-south-1
          else
            echo "ECS Service already exists"
          fi

      # ✅ DEPLOY (ONLY ONCE)
      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster wildrydes-cluster \
            --service wildrydes-service \
            --task-definition wildrydes-task \
            --force-new-deployment \
            --region ap-south-1
