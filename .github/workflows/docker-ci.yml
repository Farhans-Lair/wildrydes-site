name: Docker CI/CD - Build and Push to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::680318115068:role/GitHubActions-ECR-Push-Role
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t wildrydes-site .

      - name: Tag Docker image
        run: |
          docker tag wildrydes-site:latest 680318115068.dkr.ecr.ap-south-1.amazonaws.com/wildrydes-site:latest

      - name: Push Docker image to ECR
        run: |
          docker push <ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/wildrydes-site:latest

      - name: Create ECS Service if not exists
        run: |
          SERVICE_EXISTS=$(aws ecs describe-services \
            --cluster wildrydes-cluster \
            --services wildrydes-service \
            --region ap-south-1 \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$SERVICE_EXISTS" = "MISSING" ] || [ "$SERVICE_EXISTS" = "None" ]; then
            echo "ECS Service does not exist. Creating service..."

            aws ecs create-service \
              --cluster wildrydes-cluster \
              --service-name wildrydes-service \
              --task-definition wildrydes-task \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[subnet-xxxx,subnet-yyyy],securityGroups=[sg-xxxx],assignPublicIp=ENABLED}" \
              --region ap-south-1
          else
            echo "ECS Service already exists. Skipping creation."
          fi


      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster wildrydes-cluster \
            --service wildrydes-service \
            --force-new-deployment \
            --region ap-south-1

